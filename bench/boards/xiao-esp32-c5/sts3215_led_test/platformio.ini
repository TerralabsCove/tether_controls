; Quick bench test: FEETECH STS3215 bus servos (one-wire, half duplex) + WS2812B ring on a XIAO.
;   pio run -e xiao_c5 -t upload        then talk to it at 115200 over /dev/cu.usbmodem*
[platformio]
default_envs = xiao_c5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

; XIAO ESP32-C5: D0 = GPIO1, D1 = GPIO0, D2 = GPIO25
[env:xiao_c5]
board = seeed_xiao_esp32c5

; XIAO ESP32-S3: D0 = GPIO1, D1 = GPIO2, D2 = GPIO3
[env:xiao_s3]
board = seeed_xiao_esp32s3

; End-effector telemetry for the full electrical dry run: the same sketch, plus servo 1 and 2 state broadcast as
; tethersmall T_EE_STATE frames on ESP-NOW 5 GHz channel 36 at 50 Hz (to tethersmall gateway_c5_5g /
; gateway_cam_c5_5g, then tether_ros). EE 1 = C5 #1 (38:44:BE:1F:F9:DC), EE 2 = C5 #2 (10:BD:A3:CD:D1:B8).
[env:xiao_c5_ee1]
extends = env:xiao_c5
; EE1's servos rest at the 4095 -> 0 wrap (servo 1 at 4092, servo 2 at 39 on 2026-11-24), no offsets set yet.
; Servo 1 disabled for ROS; servo 2 may move only 20..400 steps (up from its rest, never across the wrap).
build_flags = ${env.build_flags} -DEE_ID=1 -DEE_LIM1_LO=-1 -DEE_LIM1_HI=-1 -DEE_LIM2_LO=20 -DEE_LIM2_HI=400

[env:xiao_c5_ee2]
extends = env:xiao_c5
build_flags = ${env.build_flags} -DEE_ID=2
